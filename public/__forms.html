<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="robots" content="noindex, nofollow" />
    <title>GlowJ form blueprint</title>
  </head>
  <body>
    <!--
      Static "blueprint" for Netlify Forms. Netlify reads this file at build time to
      detect the form and its fields. It is never shown: the real signup lives in
      src/components/sections/SignupForm.tsx and posts to this file's URL with fetch().

      Keep it in step with src/lib/lead-capture/netlify-forms.ts (a test checks this):
      the form name, the honeypot, and one input per submitted field.
    -->
    <form name="glowj-coming-soon" method="POST" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="glowj-coming-soon" />
      <p hidden>
        <label>Leave this empty: <input type="text" name="bot-field" /></label>
      </p>
      <input type="text" name="phone_raw" />
      <input type="text" name="phone_normalized" />
      <input type="text" name="locale" />
      <input type="text" name="source" />
      <input type="text" name="campaign" />
      <input type="text" name="consent_at" />
      <input type="text" name="consent_version" />
    </form>
  </body>
</html>
